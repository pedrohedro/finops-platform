name: Supply chain

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: supply-chain-${{ github.sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Install test dependencies
        run: |
          corepack enable
          python -m pip install \
            -r api/requirements.txt \
            -r collector/requirements.txt \
            -r normalizer/requirements.txt \
            -r forecast/requirements.txt

      - name: Run tests
        run: PYTHON=python make test

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run offline Compose smoke
        run: make smoke

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: api
            dockerfile: api/Dockerfile
          - component: dashboard
            context: dashboard
            dockerfile: dashboard/Dockerfile
          - component: collector
            context: collector
            dockerfile: collector/Dockerfile
          - component: normalizer
            context: normalizer
            dockerfile: normalizer/Dockerfile
          - component: forecast
            context: forecast
            dockerfile: forecast/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build local image
        id: image
        env:
          COMPONENT: ${{ matrix.component }}
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          image_name="ghcr.io/pedrohedro/finops-platform-${COMPONENT}"
          image_ref="${image_name}:${GITHUB_SHA}"
          sbom="sbom-${COMPONENT}-${GITHUB_SHA}.spdx.json"
          docker build --pull \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --file "$DOCKERFILE" --tag "$image_ref" "$CONTEXT"
          printf 'name=%s\nref=%s\nsbom=%s\n' \
            "$image_name" "$image_ref" "$sbom" >>"$GITHUB_OUTPUT"

      - name: Report HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          exit-code: "0"

      - name: Generate SPDX JSON SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          scanners: vuln
          format: spdx-json
          output: ${{ steps.image.outputs.sbom }}

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ matrix.component }}-${{ github.sha }}
          path: ${{ steps.image.outputs.sbom }}
          if-no-files-found: error
          retention-days: 14

      - name: Block fixable HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: "true"
          exit-code: "1"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push immutable tag and resolve digest
        id: push
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          SOURCE_REVISION: ${{ github.sha }}
        run: ./scripts/push_immutable_image.sh

      - name: Sign image digest with GitHub OIDC
        env:
          DIGEST_REF: ${{ steps.push.outputs.digest_ref }}
        run: cosign sign --yes "$DIGEST_REF"

      - name: Verify image signature identity
        env:
          DIGEST_REF: ${{ steps.push.outputs.digest_ref }}
        run: |
          cosign verify "$DIGEST_REF" \
            --certificate-identity \
              "https://github.com/pedrohedro/finops-platform/.github/workflows/supply-chain.yml@refs/heads/master" \
            --certificate-oidc-issuer \
              "https://token.actions.githubusercontent.com"

[supervisord]
nodaemon=true
user=root

[program:api]
command=uvicorn main:app --host 0.0.0.0 --port 8080
directory=/app/api
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dashboard]
command=npm start
directory=/app/dashboard
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:collector]
command=python collector.py
directory=/app/collector
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:agent]
; Agente FinOps (F1, somente leitura). Escuta apenas em loopback: o dashboard
; fala com a API (/api/agent/chat), que encaminha para ca.
command=uvicorn agent_api:app --host 127.0.0.1 --port 8090 --no-server-header
directory=/app/agent
environment=FINOPS_API_URL="http://127.0.0.1:8080"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Adicione normalizer e forecast aqui se necessário no mesmo container

version: '3.8'

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: finops_clickhouse
    env_file:
      - .env
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse_init:/docker-entrypoint-initdb.d
    networks:
      - finops_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    container_name: finops_api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    env_file:
      - .env
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=9000
    networks:
      - finops_net
    depends_on:
      clickhouse:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: finops_dashboard
    ports:
      - "3000:3000"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=http://127.0.0.1:8000
    networks:
      - finops_net
    depends_on:
      - api

  collector:
    build:
      context: ./collector
    container_name: finops_collector
    volumes:
      - ./collector:/app
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - CLICKHOUSE_HOST=clickhouse
    networks:
      - finops_net
    depends_on:
      clickhouse:
        condition: service_healthy

  normalizer:
    build:
      context: ./normalizer
    container_name: finops_normalizer
    volumes:
      - ./normalizer:/app
    environment:
      - CLICKHOUSE_HOST=clickhouse
    networks:
      - finops_net
    depends_on:
      clickhouse:
        condition: service_healthy

  forecast:
    build:
      context: ./forecast
    container_name: finops_forecast
    volumes:
      - ./forecast:/app
    environment:
      - CLICKHOUSE_HOST=clickhouse
    networks:
      - finops_net
    depends_on:
      clickhouse:
        condition: service_healthy

networks:
  finops_net:
    driver: bridge

volumes:
  clickhouse_data:
